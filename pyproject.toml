[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "dctdwt"
version = "1.0.0"
description = "Експериментальне стиснення зображень: блочне DCT 8×8 проти DWT Хаара"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "pillow>=10.1",
    "matplotlib>=3.7",
]

[project.scripts]
dctdwt = "dctdwt.__main__:main"

[tool.setuptools]
packages = ["dctdwt"]

[tool.setuptools.package-data]
dctdwt = ["data/*.png"]
